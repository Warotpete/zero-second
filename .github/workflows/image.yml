name: image
# Builds the Zero Second container and pushes it to Azure Container Registry.
# (Azure Free Trial subscriptions don't allow ACR cloud builds, so GitHub builds it.)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "Dockerfile", ".github/workflows/image.yml"]
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/zero-second:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/zero-second:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
